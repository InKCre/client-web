version: 2

registries:
  inkcre-github-packages:
    type: npm-registry
    url: https://npm.pkg.github.com
    scope: '@inkcre'
    token: ${{ secrets.INKCRE_PACKAGES_READ_TOKEN }}

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    target-branch: main
    registries:
      - inkcre-github-packages
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: main
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - '*'
