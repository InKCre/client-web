name: Pages and native Extension delivery

on:
  workflow_run:
    workflows:
      - Client checks
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  identity:
    name: Resolve exact checked main delivery
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.identity.outputs.run_id }}
      source_sha: ${{ steps.identity.outputs.source_sha }}
    steps:
      - name: Resolve the trusted checked main run
        id: identity
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const runId = context.payload.workflow_run.id
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            })
            if (
              run.name !== 'Client checks' ||
              run.path !== '.github/workflows/ci.yml' ||
              run.conclusion !== 'success' ||
              run.event !== 'push' ||
              run.head_branch !== 'main' ||
              run.head_repository?.full_name !== `${context.repo.owner}/${context.repo.repo}`
            ) {
              core.setFailed('Delivery requires a successful same-repository Client checks push run on main.')
              return
            }

            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
              per_page: 100,
            })
            const artifactNames = new Set(artifacts.map((artifact) => artifact.name))
            for (const artifactName of ['client-web-dist', 'twitter-mf-dist']) {
              if (!artifactNames.has(artifactName)) {
                core.setFailed(`Checked main run is missing required artifact: ${artifactName}`)
                return
              }
            }

            const currentMain = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/main',
            })
            if (currentMain.data.object.sha !== run.head_sha) {
              core.setFailed('A newer main revision superseded the checked artifact run.')
              return
            }

            core.setOutput('run_id', String(runId))
            core.setOutput('source_sha', run.head_sha)

  deliver:
    name: Publish native Twitter snapshot and deploy exact Pages artifact
    needs: identity
    concurrency:
      group: pages-main
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      deployments: write
      packages: read
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://app.inkcre.dev
    steps:
      - name: Checkout the exact checked delivery controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.identity.outputs.source_sha }}
          path: controller
          fetch-depth: 2
          persist-credentials: false

      - name: Require a new native Release version for Twitter changes
        id: twitter-release
        working-directory: controller
        env:
          SOURCE_SHA: ${{ needs.identity.outputs.source_sha }}
        run: |
          if ! git cat-file -e "${SOURCE_SHA}^"; then
            echo 'Cannot prove native Release intent without the checked revision parent.' >&2
            exit 1
          fi

          previous_version="$(git show "${SOURCE_SHA}^:extensions/twitter/package.json" | node --input-type=module --eval 'let input = ""; for await (const chunk of process.stdin) input += chunk; process.stdout.write(JSON.parse(input).version)')"
          current_version="$(node --input-type=module --eval 'import manifest from "./extensions/twitter/package.json" with { type: "json" }; process.stdout.write(manifest.version)')"
          if git diff --quiet "${SOURCE_SHA}^" "$SOURCE_SHA" -- extensions/twitter extensions/mf-shared.ts; then
            source_changed=false
          else
            source_changed=true
          fi

          if [[ "$source_changed" == 'true' && "$previous_version" == "$current_version" ]]; then
            echo 'Twitter native Distribution changes require a new package.json version.' >&2
            exit 1
          fi
          if [[ "$previous_version" != "$current_version" ]]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
            echo "Native Twitter Release $current_version requested." >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo 'Native Twitter publication skipped: Release version is unchanged.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install the pinned pnpm release
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.11.0

      - name: Set up Node for delivery verification
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: controller/package.json
          cache: pnpm
          cache-dependency-path: controller/pnpm-lock.yaml
          registry-url: https://npm.pkg.github.com
          scope: '@inkcre'

      - name: Install the frozen delivery controller
        working-directory: controller
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download the exact checked Pages artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: client-web-dist
          path: .pages-delivery/dist
          run-id: ${{ needs.identity.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download the exact checked Twitter snapshot
        if: steps.twitter-release.outputs.publish == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: twitter-mf-dist
          path: .twitter-mf-delivery/dist
          run-id: ${{ needs.identity.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate checked native manifest and association
        if: steps.twitter-release.outputs.publish == 'true'
        run: |
          node controller/scripts/verify-twitter-mf-distribution.mjs prepare-body \
            --package controller/extensions/twitter/package.json \
            --core-package controller/packages/core/package.json \
            --artifact-directory .twitter-mf-delivery/dist \
            --source-repository "https://github.com/${{ github.repository }}" \
            --source-revision "${{ needs.identity.outputs.source_sha }}" \
            --build-id "client-web-mf-build-${{ needs.identity.outputs.run_id }}" \
            --output .twitter-mf-delivery/prepare.json
          cd .twitter-mf-delivery/dist
          zip -q -r ../snapshot.zip .

      - name: Reverify main before native publication
        if: steps.twitter-release.outputs.publish == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SOURCE_SHA: ${{ needs.identity.outputs.source_sha }}
        with:
          script: |
            const currentMain = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/main',
            })
            if (currentMain.data.object.sha !== process.env.SOURCE_SHA) {
              core.setFailed('Main changed after checked artifacts were selected; refusing native publication.')
            }

      - name: Prepare the exact native Twitter Release
        if: steps.twitter-release.outputs.publish == 'true'
        env:
          INKCRE_EXTENSION_REGISTRY_URL: >-
            ${{ vars.INKCRE_EXTENSION_REGISTRY_URL || 'https://registry.inkcre.dev' }}
          INKCRE_EXTENSION_REGISTRY_TOKEN: ${{ secrets.INKCRE_EXTENSION_REGISTRY_TOKEN }}
        run: |
          test -n "$INKCRE_EXTENSION_REGISTRY_URL"
          test -n "$INKCRE_EXTENSION_REGISTRY_TOKEN"
          release_path="$(node --input-type=module --eval 'import { readFile } from "node:fs/promises"; const input = JSON.parse(await readFile(".twitter-mf-delivery/prepare.json", "utf8")); process.stdout.write(input.version)')"
          extension_path="$(node --input-type=module --eval 'import manifest from "./controller/extensions/twitter/package.json" with { type: "json" }; process.stdout.write(manifest.inkcre.name)')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $INKCRE_EXTENSION_REGISTRY_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary @.twitter-mf-delivery/prepare.json \
            "${INKCRE_EXTENSION_REGISTRY_URL%/}/v1/extensions/${extension_path}/releases" \
            > .twitter-mf-delivery/prepared-release.json
          printf '%s\n' "$extension_path" > .twitter-mf-delivery/extension-path
          printf '%s\n' "$release_path" > .twitter-mf-delivery/release-path

      - name: Upload the exact native Twitter snapshot
        if: steps.twitter-release.outputs.publish == 'true'
        env:
          INKCRE_EXTENSION_REGISTRY_URL: >-
            ${{ vars.INKCRE_EXTENSION_REGISTRY_URL || 'https://registry.inkcre.dev' }}
          INKCRE_EXTENSION_REGISTRY_TOKEN: ${{ secrets.INKCRE_EXTENSION_REGISTRY_TOKEN }}
        run: |
          extension_path="$(tr -d '\n' < .twitter-mf-delivery/extension-path)"
          release_path="$(tr -d '\n' < .twitter-mf-delivery/release-path)"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $INKCRE_EXTENSION_REGISTRY_TOKEN" \
            --form 'content=@.twitter-mf-delivery/snapshot.zip;type=application/zip' \
            "${INKCRE_EXTENSION_REGISTRY_URL%/}/v1/extensions/${extension_path}/releases/${release_path}/module-federation" \
            > .twitter-mf-delivery/uploaded-release.json

      - name: Publish and verify the native Twitter Release
        if: steps.twitter-release.outputs.publish == 'true'
        env:
          INKCRE_EXTENSION_REGISTRY_URL: >-
            ${{ vars.INKCRE_EXTENSION_REGISTRY_URL || 'https://registry.inkcre.dev' }}
          INKCRE_EXTENSION_REGISTRY_TOKEN: ${{ secrets.INKCRE_EXTENSION_REGISTRY_TOKEN }}
        run: |
          extension_path="$(tr -d '\n' < .twitter-mf-delivery/extension-path)"
          release_path="$(tr -d '\n' < .twitter-mf-delivery/release-path)"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $INKCRE_EXTENSION_REGISTRY_TOKEN" \
            "${INKCRE_EXTENSION_REGISTRY_URL%/}/v1/extensions/${extension_path}/releases/${release_path}/publish" \
            > .twitter-mf-delivery/published-release.json
          node controller/scripts/verify-twitter-mf-distribution.mjs verify-public \
            --registry-url "$INKCRE_EXTENSION_REGISTRY_URL" \
            --package controller/extensions/twitter/package.json \
            --core-package controller/packages/core/package.json \
            --artifact-directory .twitter-mf-delivery/dist \
            --output .twitter-mf-delivery/verification.json

      - name: Reverify main before Pages delivery
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SOURCE_SHA: ${{ needs.identity.outputs.source_sha }}
        with:
          script: |
            const currentMain = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/main',
            })
            if (currentMain.data.object.sha !== process.env.SOURCE_SHA) {
              core.setFailed('Main changed after native verification; refusing Pages delivery.')
            }

      - name: Deploy to Cloudflare Pages
        id: pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          wranglerVersion: 4.114.0
          workingDirectory: .pages-delivery
          command: >-
            pages deploy dist
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
            --branch=main
            --commit-hash=${{ needs.identity.outputs.source_sha }}
            --commit-dirty=false

      - name: Smoke-test Pages and app.inkcre.dev
        run: node controller/scripts/verify-pages-deployment.mjs
        env:
          CLOUDFLARE_PAGES_DEPLOYMENT_ID: ${{ steps.pages.outputs.pages-deployment-id }}
          CLOUDFLARE_PAGES_DEPLOYMENT_URL: ${{ steps.pages.outputs.deployment-url }}
          INKCRE_CLIENT_WEB_ORIGIN: https://app.inkcre.dev
