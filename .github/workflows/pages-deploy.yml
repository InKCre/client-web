name: Pages delivery

on:
  workflow_run:
    workflows:
      - Client checks
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  identity:
    name: Resolve exact checked main delivery
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.identity.outputs.run_id }}
      source_sha: ${{ steps.identity.outputs.source_sha }}
    steps:
      - name: Resolve the trusted checked main run
        id: identity
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const runId = context.payload.workflow_run.id
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            })
            if (
              run.name !== 'Client checks' ||
              run.path !== '.github/workflows/ci.yml' ||
              run.conclusion !== 'success' ||
              run.event !== 'push' ||
              run.head_branch !== 'main' ||
              run.head_repository?.full_name !== `${context.repo.owner}/${context.repo.repo}`
            ) {
              core.setFailed('Delivery requires a successful same-repository Client checks push run on main.')
              return
            }

            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
              per_page: 100,
            })
            if (!artifacts.some((artifact) => artifact.name === 'client-web-dist')) {
              core.setFailed('Checked main run is missing required artifact: client-web-dist')
              return
            }

            const currentMain = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/main',
            })
            if (currentMain.data.object.sha !== run.head_sha) {
              core.setFailed('A newer main revision superseded the checked artifact run.')
              return
            }

            core.setOutput('run_id', String(runId))
            core.setOutput('source_sha', run.head_sha)

  deliver:
    name: Deploy exact Pages artifact
    needs: identity
    concurrency:
      group: pages-main
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      deployments: write
      packages: read
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://app.inkcre.dev
    steps:
      - name: Checkout the exact checked delivery controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.identity.outputs.source_sha }}
          path: controller
          fetch-depth: 2
          persist-credentials: false

      - name: Install the pinned pnpm release
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.11.0

      - name: Set up Node for delivery verification
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: controller/package.json
          cache: pnpm
          cache-dependency-path: controller/pnpm-lock.yaml
          registry-url: https://npm.pkg.github.com
          scope: '@inkcre'

      - name: Install the frozen delivery controller
        working-directory: controller
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download the exact checked Pages artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: client-web-dist
          path: .pages-delivery/dist
          run-id: ${{ needs.identity.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reverify main before Pages delivery
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SOURCE_SHA: ${{ needs.identity.outputs.source_sha }}
        with:
          script: |
            const currentMain = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/main',
            })
            if (currentMain.data.object.sha !== process.env.SOURCE_SHA) {
              core.setFailed('Main changed after checked artifacts were selected; refusing Pages delivery.')
            }

      - name: Deploy to Cloudflare Pages
        id: pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          wranglerVersion: 4.114.0
          workingDirectory: .pages-delivery
          command: >-
            pages deploy dist
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
            --branch=main
            --commit-hash=${{ needs.identity.outputs.source_sha }}
            --commit-dirty=false

      - name: Smoke-test Pages and app.inkcre.dev
        run: node controller/scripts/verify-pages-deployment.mjs
        env:
          CLOUDFLARE_PAGES_DEPLOYMENT_ID: ${{ steps.pages.outputs.pages-deployment-id }}
          CLOUDFLARE_PAGES_DEPLOYMENT_URL: ${{ steps.pages.outputs.deployment-url }}
          INKCRE_CLIENT_WEB_ORIGIN: https://app.inkcre.dev
