name: Pages and Twitter Registry delivery

on:
  workflow_run:
    workflows:
      - Client checks
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  identity:
    name: Resolve exact checked main delivery
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.identity.outputs.run_id }}
      source_sha: ${{ steps.identity.outputs.source_sha }}
    steps:
      - name: Resolve the trusted checked main run
        id: identity
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const runId = context.payload.workflow_run.id
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            })
            if (
              run.name !== 'Client checks' ||
              run.path !== '.github/workflows/ci.yml' ||
              run.conclusion !== 'success' ||
              run.event !== 'push' ||
              run.head_branch !== 'main' ||
              run.head_repository?.full_name !== `${context.repo.owner}/${context.repo.repo}`
            ) {
              core.setFailed('Delivery requires a successful same-repository Client checks push run on main.')
              return
            }

            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
              per_page: 100,
            })
            const artifactNames = new Set(artifacts.map((artifact) => artifact.name))
            for (const artifactName of ['client-web-dist', 'twitter-target-dist']) {
              if (!artifactNames.has(artifactName)) {
                core.setFailed(`Checked main run is missing required artifact: ${artifactName}`)
                return
              }
            }

            const currentMain = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/main',
            })
            if (currentMain.data.object.sha !== run.head_sha) {
              core.setFailed('A newer main revision superseded the checked artifact run.')
              return
            }

            core.setOutput('run_id', String(runId))
            core.setOutput('source_sha', run.head_sha)

  deliver:
    name: Publish verified Twitter target and deploy exact Pages artifact
    needs: identity
    concurrency:
      group: pages-main
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      deployments: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://app.inkcre.dev
    steps:
      - name: Checkout the exact checked delivery controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.identity.outputs.source_sha }}
          path: controller
          persist-credentials: false

      - name: Set up Python 3.12 publisher runtime
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: controller/tooling/extension-publisher/.python-version

      - name: Install the pinned uv publisher runner
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.3
          enable-cache: true
          cache-dependency-glob: controller/tooling/extension-publisher/uv.lock

      - name: Set up Node for delivery verification
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: controller/package.json

      - name: Download the exact checked Pages artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: client-web-dist
          path: .pages-delivery/dist
          run-id: ${{ needs.identity.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download checked Twitter target artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: twitter-target-dist
          path: .twitter-target-delivery/dist
          run-id: ${{ needs.identity.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reverify main before target publication
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SOURCE_SHA: ${{ needs.identity.outputs.source_sha }}
        with:
          script: |
            const currentMain = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/main',
            })
            if (currentMain.data.object.sha !== process.env.SOURCE_SHA) {
              core.setFailed('Main changed after checked artifacts were selected; refusing target publication.')
            }

      - name: Build and validate the canonical Twitter target manifest
        run: |
          uv run --project controller/tooling/extension-publisher --frozen inkcre-ext build-target \
            --config controller/extensions/twitter/target-publish.json \
            --directory .twitter-target-delivery/dist \
            --output .twitter-target-delivery/manifest.json > .twitter-target-delivery/build.json
          node controller/scripts/verify-twitter-target-delivery.mjs inspect-local \
            --config controller/extensions/twitter/target-publish.json \
            --artifact-directory .twitter-target-delivery/dist \
            --manifest .twitter-target-delivery/manifest.json \
            --output .twitter-target-delivery/local-target.json

      - name: Capture existing target provenance
        env:
          INKCRE_EXTENSION_REGISTRY_URL: ${{ vars.INKCRE_EXTENSION_REGISTRY_URL }}
        run: |
          test -n "$INKCRE_EXTENSION_REGISTRY_URL"
          target_digest="$(node --input-type=module --eval 'import { readFile } from "node:fs/promises"; const target = JSON.parse(await readFile(".twitter-target-delivery/local-target.json", "utf8")); process.stdout.write(target.target_digest)')"
          node controller/scripts/verify-twitter-target-delivery.mjs capture-public \
            --registry-url "$INKCRE_EXTENSION_REGISTRY_URL" \
            --config controller/extensions/twitter/target-publish.json \
            --target-digest "$target_digest" \
            --output .twitter-target-delivery/before-publication.json

      - name: Publish the immutable Twitter target
        env:
          INKCRE_EXTENSION_REGISTRY_URL: ${{ vars.INKCRE_EXTENSION_REGISTRY_URL }}
          INKCRE_EXTENSION_REGISTRY_TOKEN: ${{ secrets.INKCRE_EXTENSION_REGISTRY_TOKEN }}
          SOURCE_REPOSITORY: https://github.com/${{ github.repository }}
          SOURCE_REVISION: ${{ needs.identity.outputs.source_sha }}
          BUILD_ID: client-web-target-delivery-${{ github.run_id }}
        run: |
          test -n "$INKCRE_EXTENSION_REGISTRY_URL"
          test -n "$INKCRE_EXTENSION_REGISTRY_TOKEN"
          uv run --project controller/tooling/extension-publisher --frozen inkcre-ext publish-target \
            --registry-url "$INKCRE_EXTENSION_REGISTRY_URL" \
            --config controller/extensions/twitter/target-publish.json \
            --directory .twitter-target-delivery/dist \
            --source-repository "$SOURCE_REPOSITORY" \
            --source-revision "${{ needs.identity.outputs.source_sha }}" \
            --build-id "$BUILD_ID" \
            --manifest-output .twitter-target-delivery/published-manifest.json > .twitter-target-delivery/publish.json
          cmp --silent .twitter-target-delivery/manifest.json .twitter-target-delivery/published-manifest.json

      - name: Verify the public target digest and provenance
        env:
          INKCRE_EXTENSION_REGISTRY_URL: ${{ vars.INKCRE_EXTENSION_REGISTRY_URL }}
          SOURCE_REPOSITORY: https://github.com/${{ github.repository }}
          SOURCE_REVISION: ${{ needs.identity.outputs.source_sha }}
          BUILD_ID: client-web-target-delivery-${{ github.run_id }}
        run: |
          node controller/scripts/verify-twitter-target-delivery.mjs verify-public \
            --registry-url "$INKCRE_EXTENSION_REGISTRY_URL" \
            --config controller/extensions/twitter/target-publish.json \
            --manifest .twitter-target-delivery/manifest.json \
            --before-publication .twitter-target-delivery/before-publication.json \
            --source-repository "$SOURCE_REPOSITORY" \
            --source-revision "${{ needs.identity.outputs.source_sha }}" \
            --build-id "$BUILD_ID" \
            --delivery-revision "${{ github.workflow_sha }}" \
            --delivery-run-id "${{ github.run_id }}" \
            --output .twitter-target-delivery/verification.json

      - name: Reverify main before Pages delivery
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SOURCE_SHA: ${{ needs.identity.outputs.source_sha }}
        with:
          script: |
            const currentMain = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/main',
            })
            if (currentMain.data.object.sha !== process.env.SOURCE_SHA) {
              core.setFailed('Main changed after target verification; refusing Pages delivery.')
            }

      - name: Deploy to Cloudflare Pages
        id: pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          wranglerVersion: 4.114.0
          workingDirectory: .pages-delivery
          command: >-
            pages deploy dist
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
            --branch=main
            --commit-hash=${{ needs.identity.outputs.source_sha }}
            --commit-dirty=false

      - name: Smoke-test Pages and app.inkcre.dev
        run: node controller/scripts/verify-pages-deployment.mjs
        env:
          CLOUDFLARE_PAGES_DEPLOYMENT_ID: ${{ steps.pages.outputs.pages-deployment-id }}
          CLOUDFLARE_PAGES_DEPLOYMENT_URL: ${{ steps.pages.outputs.deployment-url }}
          INKCRE_CLIENT_WEB_ORIGIN: https://app.inkcre.dev
