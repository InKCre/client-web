name: Pages deployment

on:
  workflow_run:
    workflows:
      - Client checks
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Client checks run containing client-web-dist
        required: true
        type: number

permissions:
  actions: read
  contents: read
  deployments: write
  pull-requests: read

concurrency:
  group: pages-${{ github.event.workflow_run.head_branch || inputs.run_id }}
  cancel-in-progress: true

jobs:
  identity:
    name: Resolve trusted release identity
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.identity.outputs.branch }}
      environment: ${{ steps.identity.outputs.environment }}
      head_sha: ${{ steps.identity.outputs.head_sha }}
      run_id: ${{ steps.identity.outputs.run_id }}
    steps:
      - name: Resolve exact main or internal PR
        id: identity
        uses: actions/github-script@v7
        with:
          script: |
            const runId = context.eventName === 'workflow_dispatch'
              ? Number(context.payload.inputs.run_id)
              : context.payload.workflow_run.id
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            })
            if (run.name !== 'Client checks' || run.path !== '.github/workflows/ci.yml') {
              core.setFailed('Artifact must come from the trusted Client checks workflow.')
              return
            }
            if (run.conclusion !== 'success') {
              core.setFailed('Client checks run must be successful.')
              return
            }
            if (run.head_branch === 'main') {
              const currentMain = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'heads/main',
              })
              if (currentMain.data.object.sha !== run.head_sha) {
                core.setFailed('Production delivery requires the current exact main head.')
                return
              }
              core.setOutput('branch', 'main')
              core.setOutput('environment', 'production')
              core.setOutput('head_sha', run.head_sha)
              core.setOutput('run_id', String(runId))
              return
            }
            const pulls = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: run.head_sha,
            })
            const pull = pulls.data.find((candidate) =>
              candidate.state === 'open' &&
              candidate.base.ref === 'main' &&
              candidate.head.sha === run.head_sha &&
              candidate.head.repo?.full_name === `${context.repo.owner}/${context.repo.repo}`
            )
            if (!pull) {
              core.setFailed('Run is not the exact head of an eligible internal PR.')
              return
            }
            core.setOutput('branch', `preview/client-web/pr-${pull.number}`)
            core.setOutput('environment', 'preview')
            core.setOutput('head_sha', run.head_sha)
            core.setOutput('run_id', String(runId))

  deploy:
    name: Deploy secret-free static artifact
    needs: identity
    runs-on: ubuntu-latest
    environment: ${{ needs.identity.outputs.environment }}
    steps:
      - name: Download exact checked artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: client-web-dist
          path: dist
          run-id: ${{ needs.identity.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reverify release authority before delivery
        uses: actions/github-script@v7
        env:
          RELEASE_BRANCH: ${{ needs.identity.outputs.branch }}
          RELEASE_HEAD_SHA: ${{ needs.identity.outputs.head_sha }}
        with:
          script: |
            const branch = process.env.RELEASE_BRANCH
            const expectedHead = process.env.RELEASE_HEAD_SHA
            if (branch === 'main') {
              const currentMain = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'heads/main',
              })
              if (currentMain.data.object.sha !== expectedHead) {
                core.setFailed('Main changed after artifact selection; refusing delivery.')
              }
              return
            }
            const match = /^preview\/client-web\/pr-([1-9][0-9]*)$/.exec(branch)
            if (!match) {
              core.setFailed(`Unexpected Pages review branch: ${branch}`)
              return
            }
            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(match[1]),
            })
            if (
              pull.state !== 'open' ||
              pull.base.ref !== 'main' ||
              pull.head.sha !== expectedHead ||
              pull.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`
            ) {
              core.setFailed('Pull request identity changed after artifact selection.')
            }

      - name: Deploy to Cloudflare Pages
        id: pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
            --branch=${{ needs.identity.outputs.branch }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
