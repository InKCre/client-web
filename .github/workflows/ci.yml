name: Client checks

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: >-
    client-checks-${{
      github.event.pull_request.number ||
      github.event.merge_group.head_sha ||
      github.ref
    }}
  cancel-in-progress: true

jobs:
  core-release:
    name: Resolve stable core release
    runs-on: ubuntu-latest
    outputs:
      contract_revision: ${{ steps.release.outputs.contract_revision }}
      image: ${{ steps.release.outputs.image }}
      schema_digest: ${{ steps.release.outputs.schema_digest }}
      source_revision: ${{ steps.release.outputs.source_revision }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json

      - name: Authenticate to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve stable once to an immutable release
        id: release
        run: node scripts/resolve-core-release.mjs

      - name: Record upstream release selection
        env:
          CONTRACT_REVISION: ${{ steps.release.outputs.contract_revision }}
          CORE_IMAGE: ${{ steps.release.outputs.image }}
          SCHEMA_DIGEST: ${{ steps.release.outputs.schema_digest }}
          SOURCE_REVISION: ${{ steps.release.outputs.source_revision }}
        run: |
          {
            echo '## Selected core service release'
            echo
            echo "- Image: \`$CORE_IMAGE\`"
            echo "- Source: \`$SOURCE_REVISION\`"
            echo "- Schema: \`$SCHEMA_DIGEST\`"
            echo "- Runtime contract: \`$CONTRACT_REVISION\`"
          } >> "$GITHUB_STEP_SUMMARY"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reject new high-severity vulnerabilities
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: development, runtime

  workspace:
    name: Workspace contract
    needs: core-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install the pinned pnpm release
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.11.0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@inkcre'

      - name: Install the frozen workspace
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate types from the selected raw schema
        run: pnpm contract:sync -- --image "${{ needs.core-release.outputs.image }}"

      - name: Verify static, typed, and package contracts
        run: pnpm check

      - name: Reject high-severity dependency vulnerabilities
        run: pnpm audit:dependencies

      - name: Upload the exact static artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: client-web-dist
          path: apps/client-web/dist
          if-no-files-found: error
          retention-days: 7

      - name: Reject a moved stable release
        run: >-
          node scripts/resolve-core-release.mjs
          --expect "${{ needs.core-release.outputs.image }}"

      - name: Upload unit-test evidence on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workspace-failure-evidence
          path: test-results/vitest
          if-no-files-found: ignore
          retention-days: 7

  toolchain-shadow:
    name: Type-aware and TypeScript 7 shadow
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned pnpm release
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.11.0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@inkcre'

      - name: Install the frozen workspace
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run type-aware Oxlint
        continue-on-error: true
        run: pnpm lint:type-aware

      - name: Run the native TypeScript 7 preview
        continue-on-error: true
        run: pnpm type-check:ts7

  peer-database:
    name: client-web E2E
    needs: core-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned pnpm release
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.11.0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@inkcre'

      - name: Install the frozen workspace
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install the exact browser engine
        run: pnpm exec playwright install --with-deps chromium

      - name: Authenticate to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run the selected real core service and isolated browser/database chain
        run: pnpm test:e2e:web
        env:
          INKCRE_CORE_IMAGE: ${{ needs.core-release.outputs.image }}

      - name: Reject a moved stable release
        run: >-
          node scripts/resolve-core-release.mjs
          --expect "${{ needs.core-release.outputs.image }}"

      - name: Upload browser and database evidence on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: peer-database-failure-evidence
          path: |
            test-results/playwright
            test-results/database
          if-no-files-found: ignore
          retention-days: 7

  browser-extension:
    name: client-webext E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned pnpm release
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.11.0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@inkcre'

      - name: Install the frozen workspace
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install the exact browser engine
        run: pnpm exec playwright install --with-deps chromium

      - name: Load the exact Chromium extension build
        run: pnpm test:e2e:webext

      - name: Build the Firefox extension
        run: pnpm --filter @inkcre/client-webext build:firefox

      - name: Retain the exact browser-extension artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: client-webext-builds
          path: |
            apps/client-webext/.output/chrome-mv3
            apps/client-webext/.output/firefox-mv2
          if-no-files-found: error
          retention-days: 7

      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-extension-failure-evidence
          path: test-results/playwright
          if-no-files-found: ignore
          retention-days: 7

  dependency-review-compatibility:
    name: Dependency security review
    needs: dependency-review
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    runs-on: ubuntu-latest
    steps:
      - name: Mirror the renamed required context
        env:
          RESULT: ${{ needs.dependency-review.result }}
        run: test "$RESULT" = success

  peer-database-compatibility:
    name: Peer database browser E2E
    needs: peer-database
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Mirror the renamed required context
        env:
          RESULT: ${{ needs.peer-database.result }}
        run: test "$RESULT" = success

  browser-extension-compatibility:
    name: Browser extension contract
    needs: browser-extension
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Mirror the renamed required context
        env:
          RESULT: ${{ needs.browser-extension.result }}
        run: test "$RESULT" = success
