name: Package version planning

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: package-version-main
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile application and SDK versions
    permissions:
      contents: write
      packages: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install the pinned pnpm release
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.11.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@inkcre'

      - name: Install the frozen workspace
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or update the Package Version PR
        id: changesets
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: pnpm release:version
          pr-title: 'chore(packages): version pending releases'
          commit-message: 'chore(packages): version pending releases'
          pr-base-branch: main
          create-github-releases: false
          push-git-tags: false
